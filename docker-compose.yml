services:
  mysql:
    image: mysql:8.0
    container_name: faltauno-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-faltauno_db}
      MYSQL_USER: ${MYSQL_USER:-faltauno}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-faltauno123}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-faltauno}", "-p${MYSQL_PASSWORD:-faltauno123}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: faltauno-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  backend:
    build:
      context: ./backend
    container_name: faltauno-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      CORS_ORIGIN: "*"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-faltauno}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-faltauno123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-faltauno_db}
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB_NAME: ${MONGO_DB_NAME:-faltauno_nosql}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started

  frontend:
    build:
      context: .
    container_name: faltauno-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysqldata:
  mongodata:
